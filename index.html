<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Titulo do site</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="assets/js/script.js" defer></script>
  </head>
  <body>
    <!--  header  -->
    <header>
      <img src="/assets/images/logo.png" alt="logo site" />
      <nav>
        <ul>
          <li>Home</li>
          <li>Carros</li>
          <li>Fale Conosco</li>
        </ul>
      </nav>
    </header>

    <section>
      <div class="list">
        <div class="item">
          <div class="car-img">
            <img src="./assets/images/ferrari.png" alt="Ferrari" />
          </div>
          <div class="content">
            <p class="car-information">Único Dono</p>
            <h2>Ferrari</h2>
            <p class="description">
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam,
              voluptatum.
            </p>
            <button>Próximo Carro</button>
          </div>
        </div>
      </div>

      <div class="arrows">
        <button>
          <img src="./assets/images/arrow.png" alt="seta esquerda" />
        </button>
        <button>
          <img src="./assets/images/arrow.png" alt="seta direita" />
        </button>
      </div>

      <div class="indicators">
        <div class="number">01</div>
        <ul>
          <li class="active"></li>
          <li></li>
          <li></li>
        </ul>
      </div>
    </section>
  </body>
</html>
